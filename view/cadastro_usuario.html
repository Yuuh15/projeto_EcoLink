<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Usuário Comum</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>Criar Conta (Usuário)</h2>
        <div class="subtitulo">Para se inscrever em eventos</div>
        
        <!-- MENSAGEM_AREA -->
        
        <form method="POST" action="">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha (mínimo 6 caracteres)</label>
                <input type="password" name="senha" required>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <input type="password" name="confirmar_senha" required>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        
        <div class="link">
            <a href="../php/cadastrar_criador.php">Sou criador de eventos - Cadastrar com CNPJ</a><br><br>
            <a href="../php/login.php">Já tenho conta - Faça login</a>
        </div>
    </div>
</body>
</html>
