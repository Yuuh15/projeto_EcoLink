<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contato.css"> 
    <title>EcoLink - Recuperar Senha</title>
</head>
<body class="login-page">

    <header class="navbar">
        <div class="logo">
            <h2>♻️ EcoLink</h2>
        </div>
        <nav>
            <ul style="list-style: none;">
                <li><a href="../php/login.php">Voltar ao Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Recuperar Senha</h1>
            <p>Insira seu e-mail cadastrado para receber as instruções de redefinição.</p>

            <form id="forgotForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <button type="submit" class="btn-login">Enviar Link de Recuperação</button>
                
                <div class="login-footer">
                    <span>Lembrou a senha? <a href="login.html">Faça login</a></span>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 EcoAção - Juntos por um futuro sustentável.</p>
        </div>
    </footer>

</body>
</html>
