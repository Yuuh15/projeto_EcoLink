<!-- views/cadastro_criador.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Criador de Eventos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Criador de Eventos</h2>
        <div class="subtitulo">Para criar e gerenciar eventos (CNPJ obrigatório)</div>
        
        <!-- MENSAGEM_AREA -->
        
        <form method="POST" action="">
            <h3>Dados Pessoais</h3>
            <div class="form-group">
                <label>Nome do Responsável</label>
                <input type="text" name="nome" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Senha (mínimo 6 caracteres)</label>
                <input type="password" name="senha" required>
            </div>
            <div class="form-group">
                <label>Confirmar Senha</label>
                <input type="password" name="confirmar_senha" required>
            </div>
            
            <h3>Dados da Empresa</h3>
            <div class="form-group">
                <label>Razão Social</label>
                <input type="text" name="razao_social" required>
            </div>
            <div class="form-group">
                <label>Nome Fantasia</label>
                <input type="text" name="nome_fantasia">
            </div>
            <div class="form-group">
                <label>CNPJ (99.999.999/9999-99)</label>
                <input type="text" name="cnpj" placeholder="12.345.678/0001-90" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone" placeholder="(11) 99999-9999">
            </div>
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" name="endereco" placeholder="Rua, número, cidade">
            </div>
            
            <button type="submit">Cadastrar como Criador</button>
        </form>
        
        <div class="link">
            <a href="../php/cadastrar.php">Sou usuário comum - Cadastrar sem CNPJ</a><br><br>
            <a href="../php/login_criador.php">Já tenho conta - Faça login</a>
        </div>
    </div>
</body>
</html>
