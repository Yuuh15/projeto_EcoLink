<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contato.css"> 
    <title>EcoLink - Cadastro</title>
</head>
<body class="login-page">

    <header class="navbar">
        <div class="logo">
            <h2>♻️ EcoLink</h2>
        </div>
        <nav>
            <ul style="list-style: none;">
                <li><a href=".html">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Criar Conta</h1>
            <p>Junte-se à nossa comunidade sustentável.</p>

            <form id="registerForm">
                <div class="input-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Crie uma Senha</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Cadastrar</button>
                
                <div class="login-footer">
                    <span>Já tem uma conta? <a href="login.html">Entre aqui</a></span>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 EcoAção - Juntos por um futuro sustentável.</p>
        </div>
    </footer>

</body>
</html>
